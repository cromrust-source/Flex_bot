<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexStrong Bot — Рейтинг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root { --bg: #0a0a0f; --card: #12121a; --border: #1e1e30; --accent: #7c3aed; --accent2: #a78bfa; --gold: #f59e0b; --text: #e2e8f0; --text2: #94a3b8; --green: #10b981; --red: #ef4444; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(circle at 20% 50%, rgba(124,58,237,0.04) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(245,158,11,0.04) 0%, transparent 50%); }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 15px; }
        .header h1 { font-size: 38px; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px; margin: 20px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
        .status-info { display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; }
        .status-dot.online { background: var(--green); box-shadow: 0 0 14px var(--green); animation: pulse 1.5s infinite; }
        .status-dot.offline { background: var(--red); box-shadow: 0 0 14px var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .status-text { font-size: 18px; font-weight: 700; }
        .online-text { color: var(--green); } .offline-text { color: var(--red); }
        .stats-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
        .update-badge { color: var(--text2); font-size: 12px; }
        .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .table-header { background: #0e0e16; padding: 18px 24px; border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .table-header h2 { font-size: 18px; font-weight: 700; }
        .table-scroll { max-height: 65vh; overflow-y: auto; }
        .table-scroll::-webkit-scrollbar { width: 5px; }
        .table-scroll::-webkit-scrollbar-track { background: transparent; }
        .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; }
        thead { position: sticky; top: 0; z-index: 10; background: #0e0e16; }
        th { padding: 14px 18px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text2); border-bottom: 1px solid var(--border); }
        th:first-child { width: 60px; text-align: center; }
        th:nth-child(3) { width: 90px; text-align: center; }
        th:nth-child(4) { width: 100px; text-align: right; }
        th:last-child { width: 180px; }
        td { padding: 13px 18px; border-bottom: 1px solid rgba(30,30,48,0.5); font-size: 14px; }
        td:first-child { text-align: center; }
        td:nth-child(3) { text-align: center; }
        td:nth-child(4) { text-align: right; }
        tbody tr:hover { background: rgba(124,58,237,0.05); }
        .rank { font-weight: 800; font-size: 16px; }
        .rank-1 { color: #f59e0b; font-size: 20px; }
        .rank-2 { color: #94a3b8; font-size: 18px; }
        .rank-3 { color: #cd853f; font-size: 17px; }
        .user-name { font-weight: 600; }
        .user-id { color: var(--text2); font-size: 10px; margin-left: 5px; }
        .premium-badge { display: inline-block; background: linear-gradient(135deg,#f59e0b,#d97706); color:#000; font-size:9px; padding:2px 7px; border-radius:20px; margin-left:5px; font-weight:700; }
        .diamonds { color: var(--accent2); font-weight: 600; }
        .rating-value { font-weight: 700; font-size: 15px; }
        .bar-container { display: flex; align-items: center; gap: 8px; }
        .bar-bg { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
        .bar-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
        .bar-fill.top-1 { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
        .bar-fill.top-2 { background:linear-gradient(90deg,#94a3b8,#cbd5e1); }
        .bar-fill.top-3 { background:linear-gradient(90deg,#cd853f,#d4a574); }
        .bar-percent { font-size:11px; color:var(--text2); min-width:40px; text-align:right; }
        .footer { text-align:center; padding:25px; color:#475569; font-size:12px; }
        .footer a { color:var(--accent2); text-decoration:none; }
        @media (max-width: 768px) { .header h1 { font-size: 26px; } th,td { padding: 10px 10px; font-size: 12px; } th:last-child, td:last-child { display: none; } .bar-container { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 FlexStrong Bot</h1>
            <p style="color:#64748b;font-size:12px;">Рейтинг • ТОП-100</p>
        </div>
        <div class="status-card">
            <div class="status-info">
                <span class="status-dot online" id="statusDot"></span>
                <span class="status-text online-text" id="statusText">🟢 Онлайн</span>
            </div>
            <div class="stats-row">
                <div class="stat-item"><div class="stat-value" id="totalUsers">—</div><div class="stat-label">Юзеров</div></div>
                <div class="stat-item"><div class="stat-value" id="premiumUsers">—</div><div class="stat-label">Premium</div></div>
                <div class="stat-item"><div class="stat-value" id="totalDiamonds">—</div><div class="stat-label">Алмазов</div></div>
            </div>
            <div class="update-badge" id="updateTime">Загрузка...</div>
        </div>
        <div class="table-wrapper">
            <div class="table-header"><h2>📊 Рейтинг</h2><span id="topCount">ТОП-100</span></div>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>#</th><th>Пользователь</th><th>💎</th><th>Рейтинг</th><th>Прогресс</th></tr></thead>
                    <tbody id="topBody"><tr><td colspan="5">Загрузка...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="footer">
            <p>FlexStrong Bot © 2026 • <a href="https://t.me/FlexStrong_bot">@FlexStrong_bot</a></p>
            <p style="font-size:10px;color:#475569;margin-top:5px;" id="dataSource"></p>
        </div>
    </div>
    <script>
        // Загружает данные из того же репозитория
        const DATA_URL = 'site_data.json';
        const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };

        function formatNumber(num) {
            if (num >= 1000000) return (num/1000000).toFixed(1)+'M';
            if (num >= 1000) return (num/1000).toFixed(1)+'K';
            return num.toString();
        }

        async function loadData() {
            try {
                // Добавляем timestamp чтобы обойти кеш GitHub
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await res.json();
                
                // Статус
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (data.online) {
                    dot.className = 'status-dot online';
                    text.className = 'status-text online-text';
                    text.textContent = '🟢 Онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    text.className = 'status-text offline-text';
                    text.textContent = '🔴 Оффлайн';
                }
                
                // Статистика
                document.getElementById('totalUsers').textContent = formatNumber(data.stats.total_users);
                document.getElementById('premiumUsers').textContent = formatNumber(data.stats.premium_users);
                document.getElementById('totalDiamonds').textContent = formatNumber(data.stats.total_diamonds);
                document.getElementById('updateTime').textContent = 'Обновлено: ' + (data.timestamp || '—');
                document.getElementById('dataSource').textContent = 'Источник: ' + DATA_URL;
                
                // ТОП
                document.getElementById('topCount').textContent = 'ТОП-' + data.top.length;
                
                let html = '';
                data.top.forEach(user => {
                    const pos = user.position;
                    const medal = medals[pos] || pos + '.';
                    let rankClass = '', barClass = '';
                    if (pos === 1) { rankClass = ' rank-1'; barClass = ' top-1'; }
                    else if (pos === 2) { rankClass = ' rank-2'; barClass = ' top-2'; }
                    else if (pos === 3) { rankClass = ' rank-3'; barClass = ' top-3'; }
                    
                    const div = document.createElement('div');
                    div.textContent = user.name;
                    const name = div.innerHTML;
                    const premiumBadge = user.is_premium ? ' <span class="premium-badge">👑 PREM</span>' : '';
                    const userId = user.username ? '@' + user.username : 'ID:' + user.user_id;
                    
                    html += `<tr>
                        <td><span class="rank${rankClass}">${medal}</span></td>
                        <td><span class="user-name">${name}</span>${premiumBadge}<span class="user-id">${userId}</span></td>
                        <td><span class="diamonds">💎${user.diamonds}</span></td>
                        <td><span class="rating-value">${user.rating.toLocaleString()}</span></td>
                        <td><div class="bar-container"><div class="bar-bg"><div class="bar-fill${barClass}" style="width:${user.percent}%"></div></div><span class="bar-percent">${user.percent}%</span></div></td>
                    </tr>`;
                });
                
                document.getElementById('topBody').innerHTML = html;
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').className = 'status-text offline-text';
                document.getElementById('statusText').textContent = '🔴 Нет данных';
                document.getElementById('updateTime').textContent = 'Ошибка загрузки';
                console.error(e);
            }
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
